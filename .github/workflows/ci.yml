name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phone-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Phone-side scripts against a fake phone
        run: bash tests/test-phone.sh

  entry-points:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: install.sh against a stand-in adb
        if: runner.os != 'Windows'
        run: bash tests/test-entry.sh sh
      - name: Phone-side scripts on macOS's shell
        if: runner.os == 'macOS'
        run: bash tests/test-phone.sh
      - name: install.ps1 against a stand-in adb
        if: runner.os == 'Windows'
        run: bash tests/test-entry.sh ps

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck --severity=warning install.sh uninstall.sh phone/*.sh tests/*.sh tests/fake-adb tests/stubs/*
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $found = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error
          $found | Format-Table -AutoSize
          if ($found) { exit 1 }
