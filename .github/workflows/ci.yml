name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catches download links that stop working

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Phone-side checks
        run: bash tests/test-phone.sh
      - name: install.sh against a stand-in adb
        run: bash tests/test-entry.sh sh
      - name: install.ps1 against a stand-in adb
        if: runner.os == 'Windows'
        run: bash tests/test-entry.sh ps

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck --severity=warning install.sh uninstall.sh phone/*.sh tests/*.sh tests/fake-adb tests/stubs/*
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $found = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error
          $found | Format-Table -AutoSize
          if ($found) { exit 1 }

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinned downloads still exist and still match
        run: |
          . ./versions.env
          curl -fsSL -o termux.apk "$TERMUX_APK_URL"
          echo "$TERMUX_APK_SHA256  termux.apk" | sha256sum -c -
          for os in windows darwin linux; do
            curl -fsSIL -o /dev/null "https://dl.google.com/android/repository/platform-tools-latest-$os.zip"
          done
