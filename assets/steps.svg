<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 200" width="1280" height="200" role="img" aria-label="Three steps: plug in the phone, run the installer, sign in on the phone.">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#101C33"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>
  <g class="sans">
    <g>
      <rect width="400" height="200" rx="22" fill="url(#c)"/>
      <circle cx="52" cy="54" r="22" fill="#3DDC84" fill-opacity="0.14" stroke="#3DDC84" stroke-opacity="0.5"/>
      <text x="52" y="61" text-anchor="middle" font-size="20" font-weight="700" fill="#3DDC84">1</text>
      <text x="32" y="118" font-size="25" font-weight="700" fill="#F4F8FF">Plug in the phone</text>
      <text x="32" y="150" font-size="17" fill="#8FA3BF">USB cable, with USB debugging</text>
      <text x="32" y="174" font-size="17" fill="#8FA3BF">switched on.</text>
    </g>
    <g transform="translate(440 0)">
      <rect width="400" height="200" rx="22" fill="url(#c)"/>
      <circle cx="52" cy="54" r="22" fill="#3DDC84" fill-opacity="0.14" stroke="#3DDC84" stroke-opacity="0.5"/>
      <text x="52" y="61" text-anchor="middle" font-size="20" font-weight="700" fill="#3DDC84">2</text>
      <text x="32" y="118" font-size="25" font-weight="700" fill="#F4F8FF">Run the installer</text>
      <text x="32" y="150" font-size="17" fill="#8FA3BF">Double-click <tspan class="mono" fill="#C5D1E3">install.bat</tspan>, or run</text>
      <text x="32" y="174" font-size="17" fill="#8FA3BF"><tspan class="mono" fill="#C5D1E3">./install.sh</tspan>. About 5 minutes.</text>
    </g>
    <g transform="translate(880 0)">
      <rect width="400" height="200" rx="22" fill="url(#c)"/>
      <circle cx="52" cy="54" r="22" fill="#3DDC84" fill-opacity="0.14" stroke="#3DDC84" stroke-opacity="0.5"/>
      <text x="52" y="61" text-anchor="middle" font-size="20" font-weight="700" fill="#3DDC84">3</text>
      <text x="32" y="118" font-size="25" font-weight="700" fill="#F4F8FF">Sign in on the phone</text>
      <text x="32" y="150" font-size="17" fill="#8FA3BF">Claude Code is already open.</text>
      <text x="32" y="174" font-size="17" fill="#8FA3BF">Unplug; the laptop is done.</text>
    </g>
    <g fill="none" stroke="#3DDC84" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M408 100 h22 m-8 -8 l8 8 -8 8"/>
      <path d="M848 100 h22 m-8 -8 l8 8 -8 8"/>
    </g>
  </g>
</svg>
